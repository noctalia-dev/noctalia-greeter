# noctalia-greeter - full greeter.toml example (declarative / Nix-safe)
#
# Install as /var/lib/noctalia-greeter/greeter.toml (owned by the greetd user).
# On NixOS: services.displayManager.noctalia-greeter.settings = { ... };  (nixpkgs)
# or: programs.noctalia-greeter.settings = { ... };  (project flake)
#
# This file is the full admin config. Sync and the login UI never write it.
# Mutable Sync/UI data lives in sync.toml (lower priority when both set).
# Sync merges appearance/output into sync.toml; a complete [appearance.palette] here wins.
#
# Omit any key for the built-in default.
# Docs: https://docs.noctalia.dev/greeter/configuration/

[session]
# Session Name from `noctalia-greeter sessions` (picker label) or its .desktop filename.
default = "niri"

[user]
# Opens the password step for this account on startup.
default = "lysec"

[appearance]
# Color scheme name: "Synced" (palette below or Sync sync.toml), or a builtin
# like "Noctalia", "Catppuccin", .... Overrides last UI pick in sync.toml when set.
scheme = "Synced"
# Password mask: "default" (filled circles) or "random" (cycled glyph shapes).
password_style = "random"
# Hide the Noctalia brand logo on the login screen.
hide_logo = false
# Power controls: bottom-right (default), bottom-left, top-left, top-right, or hidden.
power_buttons_position = "bottom-right"
# Scheme picker: bottom-right (default), top-left, top-right, bottom-left, or hidden.
scheme_selector_position = "bottom-right"
theme_mode = "dark"
corner_radius_scale = 1.0
# Optional; empty / omit keeps the greeter default font.
font_family = "Inter"

# Required for a declarative Synced look (same keys Sync writes under [appearance.palette]).
# When complete, this wins over Sync's sync.toml appearance.
[appearance.palette]
primary = "#fff59b"
on_primary = "#0e0e43"
secondary = "#a9aefe"
on_secondary = "#0e0e43"
tertiary = "#9BFECE"
on_tertiary = "#0e0e43"
error = "#FD4663"
on_error = "#0e0e43"
surface = "#070722"
on_surface = "#f3edf7"
surface_variant = "#11112d"
on_surface_variant = "#7c80b4"
outline = "#21215F"
shadow = "#070722"
hover = "#9BFECE"
on_hover = "#0e0e43"

[appearance.wallpaper]
# Applied independently of scheme/palette selection.
# Absolute path, or color:#RRGGBB.
# JPEG XL (.jxl) wallpapers are supported.
# fill_mode: center | crop | fit | stretch | repeat | span
# span projects one image across the logical multi-monitor layout; with one pinned output it behaves like crop.
path = "/var/lib/noctalia-greeter/wallpaper.webp"
fill_mode = "crop"
# May also be used without path for a solid background.
# fill_color = "#070722"
# Background effects, 0.0 (off, default) to 1.0. tint uses the active scheme's surface color.
# blur = 0.75
# tint = 0.4

# Optional per-connector wallpapers (overrides [appearance.wallpaper] for that output):
# [appearance.wallpapers.DP-1]
# path = "/var/lib/noctalia-greeter/wallpaper-DP-1.webp"
# fill_mode = "crop"

[clock]
# Configure the default time/date Clock widget pair (default true), left of the login card.
# An explicit administrator [widgets] table supersedes these legacy keys.
# The host name is shown in the login card.
enabled = true
# center-left (default), above-panel, top-left, top-center, top-right, bottom-left, bottom-center, bottom-right.
# Optional components move inward or hide when they cannot fit around login.
position = "center-left"
# Noctalia-compatible bare strftime or C++ chrono formats. Empty hides that line.
time_format = "{:%H:%M}"
# Locale-preferred date, matching Noctalia's default.
# Uses the inherited time locale, then system locale files, then en_US.UTF-8 (if installed).
date_format = "%A, %x"
# Font sizes in logical pixels before UI scaling; positive numbers, capped at 4096.
time_font_size = 112
date_font_size = 19

# Optional component layout overrides. Explicit administrator fields win over sync.toml.
# Explicit legacy administrator positions/visibility also win over matching Sync fields.
# All coordinates/sizes are logical pixels. Omitted fields inherit Sync, then defaults.
[layout]
# auto/minimal use the compact card only with a configured user and valid default session.
# full always retains account/session pickers. Esc leaves the compact password step.
login_mode = "auto"

# Omit these to retain responsive default placement and automatic compact width.
# [layout.login]
# anchor = "center-right"
# width = 420
# x = 0
# y = 0
# Login cannot be hidden or targeted to one output.

# [layout.clock]
# visible = true
# anchor = "center-left"
# output = "DP-1"  # Optional exact connector/stable ID; hides when disconnected.

# [layout.branding]
# visible = true
# Other optional component IDs: power, appearance, keyboard.
# Anchors: top-left/center/right, center-left/center/right, bottom-left/center/right.
# Offsets x/y: -8192..8192; width: 32..1600 (login further bounded to 280..640).
# Transforms: rotation (finite radians), scale (0.5..4), flip_x/flip_y (booleans).
# The whole component and its input transform together; popups stay upright.
# Oversized transformed components scale down to fit the output.

# Optional desktop-widget collection. Administrator [widgets] owns the whole collection.
# See docs/user/configuration.md for a complete example and supported settings.
# Empty [widgets] requests the default time/date Clock pair; widget_order=[] renders none.
# A custom list replaces that pair; include ordinary Clock entries to retain time/date.
# [widgets]
# widget_order = ["welcome"]
# [widgets.widget.welcome]
# type = "label"
# placement = "anchor"
# anchor = "top-left"
# y = 100
# box_width = 500
# box_height = 100
# [widgets.widget.welcome.settings]
# title = "Welcome home"
# background = false
# Sticker image_path accepts widget-assets/<lowercase-sha256>.png in the state directory
# or its exact installed absolute path. PNGs are bounded and hash-checked; no links/URLs.
# The constrained helper and Noctalia editor Save & apply can install profiles and managed PNGs.

[output]
# Use layout, transforms, and scales from sync.toml when not declared here (default true).
# Set false to use independent display settings while keeping appearance sync.
# For automatic layout/scaling, also omit layout, scales, and scale below.
use_synced_settings = true
# Pin the greeter to one connector or stable EDID identifier; omit to mirror on every monitor.
# List both with: noctalia-greeter outputs --details
name = "DP-2"
# name = "Acer Technologies XV242Y TL1EE0018521"
# Multi-monitor positions (logical pixels). Connector names or stable identifiers; use semicolons when identifiers
# contain spaces. Outputs omitted from the mapping are appended to the right with automatic scale.
# Overrides Sync layout in sync.toml when set.
layout = "DP-1:0,0; DP-2:2560,0"
# Preferred DRM mode size in pixels (both required if set).
width = 5120
height = 2160
# Preferred refresh rate in Hz; nominal values match fractional modes within 1 Hz.
refresh_rate = 120
# Or configure different rates per output (use one form or the other).
# refresh_rate = "DP-1:120; HDMI-A-1:60"
# Per-output DRM transform by connector or stable identifier. Overrides Sync transforms in sync.toml when set.
# Tokens: normal/0/none, 90, 180, 270, flipped, flipped-90, flipped-180, flipped-270
transforms = "DP-1:normal; DP-2:normal"
# Per-output scale by connector or stable identifier, matching the session's logical layout coordinates.
# Overrides Sync scales when set.
# Distinct from global `scale` below, which forces one scale on every output.
scales = "DP-1:1; DP-2:1"
# Manual UI scale for all outputs; omit or invalid -> per-output scales, else auto from display geometry.
scale = 1.5

[idle]
# Seconds with no input before blanking outputs; 0 disables (range 0-86400).
timeout = 300

[cursor]
# Exact, case-sensitive theme directory name (for example, Arch Breeze is breeze_cursors).
theme = "Adwaita"
size = 24
# Colon-separated search path when the theme is not under the default icon dirs.
path = "/usr/share/icons"

[pointer]
# Acceleration profile: "flat" (default) or "adaptive".
accel_profile = "flat"
# Optional libinput speed: -1.0 (slowest) to 1.0 (fastest), 0.0 is neutral.
# Omit to leave the device's speed unchanged.
# accel_speed = 0.0

[keyboard]
# Comma-separated for multiple layouts.
layout = "us,cz"
variant = ",qwertz"
options = "grp:alt_shift_toggle"
# Start with Num Lock locked (default true if omitted).
numlock = true

[auth]
# Allow an empty submit to start fprintd / smartcard PAM. Default false.
# PAM remains serialized: this does not allow password input while pam_fprintd waits.
allow_empty_password = false
# Seconds to wait for each greetd reply (0-3600). Keep this longer than any
# fingerprint timeout; 0 disables the watchdog.
request_timeout = 60

# Optional per-output visual overrides, inheriting the shared [layout] fields.
# [layout.outputs."DP-1".login]
# anchor = "center"
# x = 0
# y = 0
# [layout.outputs."DP-2".keyboard]
# anchor = "top-right"
